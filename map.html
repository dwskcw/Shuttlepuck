<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shubble live map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
    <script type="importmap">
        {"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.js"}}
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="./map.css">
</head>
<body>
    <div id="map"></div>
    <aside id="panel">
        <p id="status" role="status">Loading routes…</p>
        <section id="routes-panel" aria-label="Route visibility controls">
            <div class="routes-panel-title">Visible routes</div>
            <div id="route-tree" aria-label="Nested route checkboxes"></div>
            <label class="schedule-field">CDTA schedule date
                <input id="cdta-date" type="date">
            </label>
            <p id="cdta-status" role="status">Loading CDTA data…</p>
            <p id="bike-status" role="status">Loading bike locations…</p>
        </section>
    </aside>

    <button id="journey-open" type="button">🧭 Directions</button>

    <aside id="journey-panel" aria-label="Trip planner" hidden>
        <div class="journey-head">
            <div class="routes-panel-title">Plan a trip</div>
            <button id="journey-close" type="button" aria-label="Close trip planner">✕</button>
        </div>
        <div class="journey-endpoints">
            <button id="journey-set-origin" type="button" class="journey-endpoint">Set origin</button>
            <button id="journey-set-destination" type="button" class="journey-endpoint">Set destination</button>
        </div>
        <label class="journey-field">Depart at (Troy time)
            <input id="journey-when" type="time" value="12:00">
            <input id="journey-date" type="date">
        </label>
        <button id="journey-search" type="button" class="journey-search-btn">Find routes</button>
        <p id="journey-hint" role="status">Click the map to set origin, then destination.</p>
        <button id="journey-retry" type="button" hidden>Retry loading schedules</button>
        <div id="journey-results" aria-live="polite"></div>
    </aside>

    <script type="module" src="./map.js"></script>
</body>
</html>
