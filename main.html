<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
    <script type="importmap">
        {"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.js"}}
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="map" style="height: 400px"></div>
    <script type="module">
        import {LeafletMap, TileLayer} from 'leaflet';

         const map = new LeafletMap('map', {
            center: [42.730, -73.677],
            zoom: 17
        });
        
        const tiles = new TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://openstreetmap.org">OpenStreetMap</a>'
        });

        tiles.addTo(map);
</script>
</body>
</html>
