<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
    <script type="importmap">
        {"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.js"}}
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="map" style="height: 400px"></div>
    <script type="module">
        import {LeafletMap, TileLayer} from 'leaflet';

         const map = new LeafletMap('map', {
            center: [42.730, -73.677],
            zoom: 17
        });
        
        const tiles = new TileLayer('https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/512/{z}/{x}/{y}@2x?access_token=pk.eyJ1IjoiZHdza2N3IiwiYSI6ImNtdzZyd3d3ZzBpY2IzMG9wc28weXNsbHgifQ.9zT3RQw_K7LbSSYeJXxPNg', {
    		tileSize: 512,
    		zoomOffset: -1,
    		maxZoom: 22,
    		attribution:
      			'© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> ' +
      			'© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        });

        tiles.addTo(map);
</script>
</body>
</html>
